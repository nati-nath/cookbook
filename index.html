<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cookbook</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cookbook">
<meta name="theme-color" content="#f5f4f0">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
  :root {
    --bg: #f5f4f0; --surface: #fff; --ink: #101010; --muted: #55534c;
    --primary: #ff3d1a; --accent: #1a1aff;
    --sans: "Neue Haas Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --sm: 8px; --md: 16px; --lg: 32px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; border-radius: 0; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-size: 1rem; line-height: 1.6; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; isolation: isolate; overflow-x: hidden;
    padding: calc(env(safe-area-inset-top) + var(--md)) var(--md) calc(env(safe-area-inset-bottom) + var(--md));
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Title sits on an off-grid red block */
  header {
    flex: 0 0 auto; position: relative; align-self: flex-start;
    font-size: clamp(2.4rem, 11vw, 4rem); font-weight: 700; line-height: 1.05; letter-spacing: -0.03em;
    padding: 0 var(--sm) var(--sm) 0;
  }
  header::before {
    content: ""; position: absolute; z-index: -1; left: 0.9rem; bottom: 0; width: 62%; height: 0.55em;
    background: var(--primary);
  }
  main { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: var(--md) 6px var(--lg) 0; }
  .panel { display: none; }
  .panel.active { display: block; }

  button {
    font-family: var(--sans); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink); background: var(--surface); border: 2px solid var(--ink);
    padding: 12px var(--md); cursor: pointer; box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.1s linear, box-shadow 0.1s linear;
  }
  button:hover { background: var(--bg); }
  button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  button.on { background: var(--primary); }
  button.quiet { border: none; box-shadow: none; background: none; color: var(--ink); padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; }
  button.quiet:active { transform: none; }
  button.danger { background: var(--ink); color: var(--surface); }

  input[type=search] {
    width: 100%; font-family: var(--sans); font-size: 1rem; color: var(--ink); background: var(--surface);
    border: 2px solid var(--ink); padding: 12px; margin-bottom: var(--md); box-shadow: 4px 4px 0 var(--accent);
    -webkit-user-select: text; user-select: text;
  }
  .filters { display: flex; gap: var(--sm); margin-bottom: var(--md); }
  .filters select {
    flex: 1; min-width: 0; font-family: var(--sans); font-size: 1rem; color: var(--ink); background: var(--surface);
    border: 2px solid var(--ink); padding: 10px; box-shadow: 2px 2px 0 var(--ink); border-radius: 0;
  }

  /* Recipe grid: square photo with the title underneath, four across */
  #cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--md) var(--sm); margin-bottom: var(--lg); }
  .card {
    position: relative; display: block; width: 100%; text-align: left;
    text-transform: none; letter-spacing: 0; font-size: 1rem; font-weight: 400;
    padding: 0; border: none; box-shadow: none; background: none;
  }
  .card .ph { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; }
  .card .t { overflow-wrap: anywhere; font-size: 0.8rem; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; margin-top: var(--sm); }
  .card .m { color: var(--muted); font-size: 0.65rem; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; margin-top: 4px; }
  .card .nophoto { aspect-ratio: 1 / 1; background: var(--surface); border: 2px solid var(--ink); }

  /* Photos: the recipe page offsets the photo against a blue block */
  .hero { position: relative; margin: var(--md) 0 var(--lg) 0; }
  .hero::before { content: ""; position: absolute; z-index: -1; inset: 12px -4px -12px 10px; background: var(--accent); }
  .hero img { display: block; width: 100%; max-height: 24rem; object-fit: cover; border: 2px solid var(--ink); background: var(--surface); }
  .credit { font-size: 0.75rem; color: var(--muted); margin: var(--md) 0 0; }
  .credit a { color: var(--muted); }

  /* Request form */
  .form label { display: block; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin: var(--md) 0 4px; }
  .form label small { display: block; color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 0.8rem; }
  .form input, .form textarea {
    width: 100%; font-family: var(--sans); font-size: 1rem; color: var(--ink); background: var(--surface);
    border: 2px solid var(--ink); padding: 10px; -webkit-user-select: text; user-select: text;
  }
  .form textarea { min-height: 7rem; resize: vertical; }
  .form .two { display: flex; gap: var(--md); }
  .form .two > div { flex: 1; }
  .form .err { color: #b00000; font-weight: 600; margin: 4px 0 0; }
  .form button[type=submit] { background: var(--primary); margin-top: var(--lg); width: 100%; }
  .empty { color: var(--muted); margin-top: var(--lg); line-height: 1.6; }

  h1 { font-size: clamp(2.1rem, 10vw, 3.4rem); font-weight: 700; line-height: 1.05; letter-spacing: -0.03em; margin: var(--md) 0 var(--sm); overflow-wrap: anywhere; }
  h2 {
    display: inline-block; background: var(--ink); color: var(--surface);
    font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 2px 12px; margin: var(--lg) 0 var(--sm) -6px;
  }
  .sub { color: var(--muted); margin: 0 0 var(--md); }

  /* Time blocks overlap and stagger */
  .times { display: flex; margin: var(--md) 0 var(--lg); }
  .times div { flex: 1; border: 2px solid var(--ink); background: var(--surface); padding: var(--sm); }
  .times div + div { margin-left: -2px; }
  .times div:nth-child(2) { background: var(--primary); transform: translateY(10px); position: relative; z-index: 1; }
  .times div:nth-child(3) { background: var(--accent); color: #fff; }
  .times b { display: block; font-size: 1.6rem; line-height: 1.1; letter-spacing: -0.02em; }
  .times span { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  .flag { background: var(--primary); color: #000; border: 2px solid var(--ink); padding: 2px 10px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; display: inline-block; transform: rotate(-1.5deg); margin: 0 0 var(--sm); }

  ul.ing, ol.steps { padding: 0; margin: 0; list-style: none; }
  ul.ing li { display: flex; justify-content: space-between; gap: var(--md); padding: 8px 0; border-bottom: 1px solid var(--ink); }
  ul.ing li .q { color: var(--accent); font-weight: 600; text-align: right; }
  .grp { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: var(--md) 0 2px; }
  ol.steps { counter-reset: s; }
  ol.steps li { counter-increment: s; display: flex; gap: var(--md); padding: 12px 0; border-bottom: 1px solid var(--ink); }
  ol.steps li::before { content: counter(s); color: var(--primary); font-size: 2rem; font-weight: 700; line-height: 1; min-width: 2rem; letter-spacing: -0.03em; }
  ul.plain { padding-left: 1.1rem; }

  .bar { display: flex; gap: var(--md); margin: var(--md) 0; flex-wrap: wrap; }
  .bar button { flex: 1 1 auto; }
  #add { background: var(--primary); }
  #add.on { background: var(--accent); color: #fff; }

  .plan { display: flex; align-items: center; gap: var(--sm); border-bottom: 1px solid var(--ink); padding: var(--sm) 0; }
  .plan .n { flex: 1; font-weight: 700; }
  .plan button { padding: 4px 12px; box-shadow: 2px 2px 0 var(--ink); }
  .plan .c { min-width: 1.6rem; text-align: center; font-weight: 700; font-size: 1.25rem; }
  label.item { display: flex; gap: var(--md); align-items: center; padding: 12px 0; border-bottom: 1px solid var(--ink); }
  label.item input { accent-color: var(--accent); width: 1.25rem; height: 1.25rem; flex: none; }
  label.item .q { color: var(--accent); font-weight: 600; white-space: nowrap; }
  label.item.done { color: var(--muted); text-decoration: line-through; }
  label.item.done .q { color: var(--muted); }

  #tabbar { flex: 0 0 auto; display: flex; margin: 0 6px 0 0; border: 2px solid var(--ink); background: var(--surface); box-shadow: 4px 4px 0 var(--ink); }
  #tabbar button { flex: 1; border: none; border-right: 2px solid var(--ink); box-shadow: none; background: none; padding: 14px 4px; }
  #tabbar button:last-child { border-right: none; }
  #tabbar button:active { transform: none; }
  #tabbar button.active { background: var(--primary); }

  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<header id="head">Cookbook</header>
<main>
  <section id="tab-recipes" class="panel active">
    <div id="list-view">
      <input id="q" type="search" placeholder="Search name, tag or ingredient" autocomplete="off">
      <div class="filters">
        <select id="time-sel" aria-label="Time"></select>
        <select id="tag-sel" aria-label="Category"></select>
      </div>
      <div id="cards"></div>
    </div>
    <div id="detail-view" hidden></div>
  </section>
  <section id="tab-grocery" class="panel"></section>
  <section id="tab-request" class="panel">
    <p>Know a recipe that belongs here? Fill in what you can. Only the dish name is needed.</p>
    <p class="sub">Sending opens your email app with the request written for you. Attach a picture there if you have one, then press Send.</p>
    <form class="form" id="req" novalidate>
      <label for="f-name">Dish name *</label>
      <input id="f-name" name="name" autocomplete="off" aria-describedby="f-name-err">
      <p class="err" id="f-name-err" role="alert" hidden>Add a dish name so I know what to look for.</p>
      <label for="f-photo">Picture <small>A link to a photo. You can also attach one in your email.</small></label>
      <input id="f-photo" name="photo" type="url" inputmode="url" autocomplete="off">
      <div class="two">
        <div><label for="f-prep">Prep (min)</label><input id="f-prep" name="prep" inputmode="numeric" autocomplete="off"></div>
        <div><label for="f-cook">Cook (min)</label><input id="f-cook" name="cook" inputmode="numeric" autocomplete="off"></div>
      </div>
      <label for="f-tags">Tags <small>For example japanese, vegetarian, oven</small></label>
      <input id="f-tags" name="tags" autocomplete="off">
      <label for="f-ingredients">Ingredients <small>One per line, with the amount. For example “2 courgettes”.</small></label>
      <textarea id="f-ingredients" name="ingredients"></textarea>
      <label for="f-method">Method <small>One step per line.</small></label>
      <textarea id="f-method" name="method"></textarea>
      <label for="f-notes">Variations and notes</label>
      <textarea id="f-notes" name="notes"></textarea>
      <label for="f-source">Where is it from? <small>A link, or the name of a person or book.</small></label>
      <input id="f-source" name="source" autocomplete="off">
      <button type="submit">Send request by email</button>
      <button type="button" id="copy-req" class="quiet">No email app? Copy the request</button>
    </form>
  </section>
</main>
<nav id="tabbar">
  <button data-tab="recipes" class="active">Recipes</button>
  <button data-tab="grocery">Grocery <span id="gcount"></span></button>
  <button data-tab="request">Request</button>
</nav>

<script>
const KEY = "cookbook.v1";
let recipes = [];
let state = { plan: {}, checked: {} };   // plan: {recipeId: times}; checked: {itemKey: true}
const ui = { maxTime: 0, tag: "", query: "" };

try { state = Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const total = (r) => r.prep_minutes + r.cook_minutes;
const tilde = (r) => (r.time_is_estimate ? "~" : "");

// ---- amounts -------------------------------------------------------------
const FRACS = [[0.125, "⅛"], [0.25, "¼"], [1 / 3, "⅓"], [0.5, "½"], [2 / 3, "⅔"], [0.75, "¾"]];
function num(x) {
  const whole = Math.floor(x + 1e-9), rest = x - whole;
  if (rest < 0.05) return String(whole);
  const f = FRACS.find(([v]) => Math.abs(v - rest) < 0.05);
  if (f) return (whole ? whole : "") + f[1];
  return String(Math.round(x * 10) / 10);
}
function range(lo, hi) { return hi && hi !== lo ? `${num(lo)}–${num(hi)}` : num(lo); }
function spoons(tsp) {   // 3 tsp = 1 tbsp
  const tb = Math.floor(tsp / 3 + 1e-9), t = tsp - tb * 3;
  return [tb ? `${num(tb)} tbsp` : "", t > 0.01 ? `${num(t)} tsp` : ""].filter(Boolean).join(" + ");
}
function fmtQty(it) {
  if (it.qty == null) return it.note || "";
  const spoon = it.unit === "tsp" || it.unit === "tbsp";
  if (spoon) {
    const f = it.unit === "tbsp" ? 3 : 1;
    const lo = it.qty * f, hi = (it.qty_max ?? it.qty) * f;
    return hi !== lo ? `${num(lo)}–${num(hi)} tsp` : spoons(lo);
  }
  const many = (it.qty_max ?? it.qty) > 1 && /^(clove|block)$/.test(it.unit);
  return `${range(it.qty, it.qty_max)}${it.unit ? " " + it.unit + (many ? "s" : "") : ""}`;
}

// ---- tabs ----------------------------------------------------------------
function showTab(name) {
  document.querySelectorAll("#tabbar button").forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === "tab-" + name));
  $("#head").textContent = { grocery: "Grocery list", request: "Request a recipe" }[name] || "Cookbook";
  if (name === "grocery") renderGrocery(); else closeDetail();
}
document.querySelectorAll("#tabbar button").forEach((b) => (b.onclick = () => showTab(b.dataset.tab)));

// ---- recipe list ---------------------------------------------------------
function renderList() {
  const fill = (el, items, current, onPick) => {
    el.innerHTML = items.map(([v, label]) => `<option value="${esc(v)}"${v === current ? " selected" : ""}>${esc(label)}</option>`).join("");
    el.onchange = () => onPick(el.value);
  };
  fill($("#time-sel"), [["0", "Any time"], ["20", "Up to 20 min"], ["30", "Up to 30 min"], ["45", "Up to 45 min"]], String(ui.maxTime),
    (v) => { ui.maxTime = +v; renderList(); });
  const tags = [...new Set(recipes.flatMap((r) => r.tags))].sort();
  fill($("#tag-sel"), [["", "All categories"], ...tags.map((t) => [t, t])], ui.tag, (v) => { ui.tag = v; renderList(); });

  const q = ui.query.trim().toLowerCase();
  const hits = recipes
    .filter((r) => !ui.maxTime || total(r) <= ui.maxTime)
    .filter((r) => !ui.tag || r.tags.includes(ui.tag))
    .filter((r) => !q || [r.name, r.subtitle || "", ...r.tags, ...r.ingredients.map((i) => i.name)].join(" ").toLowerCase().includes(q))
    .sort((a, b) => total(a) - total(b));
  $("#cards").innerHTML = hits.length
    ? hits.map((r) => `<button class="card" data-id="${r.id}">${r.image ? `<img class="ph" src="${esc(r.image)}" alt="${esc(r.image_alt || r.name)}" loading="lazy">` : `<div class="nophoto"></div>`}<div class="t">${esc(r.name)}</div>
        <div class="m">${tilde(r)}${total(r)} min${state.plan[r.id] ? " · on list" : ""}</div></button>`).join("")
    : `<div class="empty">No recipe matches.</div>`;
  $("#cards").querySelectorAll(".card").forEach((c) => (c.onclick = () => openDetail(c.dataset.id)));
}
$("#q").oninput = (e) => { ui.query = e.target.value; renderList(); };

// ---- recipe detail -------------------------------------------------------
function openDetail(id) {
  const r = recipes.find((x) => x.id === id);
  let last = null, ing = "";
  for (const i of r.ingredients) {
    if ((i.group || "") !== last) { last = i.group || ""; if (last) ing += `<div class="grp">${esc(last)}</div>`; }
    const q = i.qty == null ? i.note || "" : fmtQty(i) + (i.note ? ` (${i.note})` : "");
    ing += `<li><span>${esc(i.name)}</span><span class="q">${esc(q)}</span></li>`;
  }
  const on = state.plan[id];
  $("#detail-view").innerHTML = `
    <button class="quiet" id="back">← All recipes</button>
    <h1>${esc(r.name)}</h1>
    ${r.subtitle ? `<p class="sub">${esc(r.subtitle)}</p>` : ""}
    ${r.image ? `<div class="hero"><img src="${esc(r.image)}" alt="${esc(r.image_alt || r.name)}"></div>
      ${r.image_credit ? `<p class="credit"><a href="${esc(r.image_credit.url)}" target="_blank" rel="noopener">${esc(r.image_credit.text)}</a></p>` : ""}` : ""}
    <div class="times">
      <div><b>${tilde(r)}${r.prep_minutes}</b><span>prep min</span></div>
      <div><b>${tilde(r)}${r.cook_minutes}</b><span>cook min</span></div>
      <div><b>${tilde(r)}${total(r)}</b><span>total min</span></div>
    </div>
    <div class="bar"><button id="add" class="${on ? "on" : ""}">${on ? "On grocery list ✓ (tap to remove)" : "+ Add to grocery list"}</button></div>
    <h2>Ingredients</h2><ul class="ing">${ing}</ul>
    <h2>Method</h2>
    ${r.method_inferred ? `<div class="flag">Method not in the source. Typical roast, edit me</div>` : ""}
    <ol class="steps">${r.steps.map((s) => `<li><span>${esc(s)}</span></li>`).join("")}</ol>
    ${r.note ? `<h2>Note</h2><p>${esc(r.note)}</p>` : ""}
    ${r.variations && r.variations.length ? `<h2>Variations</h2><ul class="plain">${r.variations.map((v) => `<li>${esc(v)}</li>`).join("")}</ul>` : ""}
    <h2>Source</h2><p class="sub">${esc(r.source)}</p>`;
  $("#back").onclick = closeDetail;
  $("#add").onclick = () => { if (state.plan[id]) delete state.plan[id]; else state.plan[id] = 1; save(); updateCount(); openDetail(id); };
  $("#list-view").hidden = true; $("#detail-view").hidden = false;
  document.querySelector("main").scrollTop = 0;
}
function closeDetail() { $("#detail-view").hidden = true; $("#list-view").hidden = false; renderList(); }

// ---- grocery list --------------------------------------------------------
function buildList() {
  const map = new Map();
  for (const [id, times] of Object.entries(state.plan)) {
    const r = recipes.find((x) => x.id === id);
    if (!r) continue;
    for (const i of r.ingredients) {
      if (i.no_grocery) continue;
      const spoon = i.unit === "tsp" || i.unit === "tbsp";
      const unit = spoon ? "tsp" : i.unit;                       // spoons are summed in tsp
      const f = i.unit === "tbsp" ? 3 : 1;
      const key = `${i.name}|${unit}`;
      const e = map.get(key) || { key, name: i.name, unit, aisle: i.aisle, pantry: !!i.pantry, qty: null, qty_max: null, notes: new Set() };
      if (i.qty != null) {
        e.qty = (e.qty || 0) + i.qty * f * times;
        e.qty_max = (e.qty_max || 0) + (i.qty_max ?? i.qty) * f * times;
      } else if (i.note) e.notes.add(i.note);
      map.set(key, e);
    }
  }
  return [...map.values()].map((e) => {
    const out = { ...e, q: "" };
    if (e.qty != null) out.q = fmtQty({ qty: e.qty, qty_max: e.qty_max === e.qty ? null : e.qty_max, unit: e.unit });
    else out.q = [...e.notes].join(", ");
    return out;
  });
}
function updateCount() {
  const n = Object.keys(state.plan).length;
  $("#gcount").textContent = n ? `(${n})` : "";
}
function renderGrocery() {
  const el = $("#tab-grocery");
  const ids = Object.keys(state.plan).filter((id) => recipes.some((r) => r.id === id));
  if (!ids.length) {
    el.innerHTML = `<div class="empty">Nothing planned yet.<br>Open a recipe and tap “Add to grocery list”.</div>`;
    return;
  }
  const items = buildList();
  const buy = items.filter((i) => !i.pantry), pantry = items.filter((i) => i.pantry);
  const aisles = [...new Set(buy.map((i) => i.aisle))].sort();
  const row = (i) => `<label class="item ${state.checked[i.key] ? "done" : ""}"><input type="checkbox" data-k="${esc(i.key)}" ${state.checked[i.key] ? "checked" : ""}>
      <span style="flex:1">${esc(i.name)}</span><span class="q">${esc(i.q)}</span></label>`;
  el.innerHTML = `
    <h2 style="margin-top:0">Planned</h2><br>
    ${ids.map((id) => { const r = recipes.find((x) => x.id === id); return `<div class="plan"><span class="n">${esc(r.name)}</span>
      <button data-id="${id}" data-d="-1">−</button><span class="c">${state.plan[id]}</span><button data-id="${id}" data-d="1">+</button></div>`; }).join("")}
    ${aisles.map((a) => `<h2>${esc(a)}</h2>${buy.filter((i) => i.aisle === a).map(row).join("")}`).join("")}
    ${pantry.length ? `<h2>Check you have</h2>${pantry.map(row).join("")}` : ""}
    <div class="bar"><button id="copy">Copy list</button><button id="untick">Untick all</button><button id="clear" class="danger">Clear all</button></div>`;

  el.querySelectorAll(".plan button").forEach((b) => (b.onclick = () => {
    const n = state.plan[b.dataset.id] + +b.dataset.d;
    if (n < 1) delete state.plan[b.dataset.id]; else state.plan[b.dataset.id] = n;
    save(); updateCount(); renderGrocery();
  }));
  el.querySelectorAll("input[type=checkbox]").forEach((c) => (c.onchange = () => {
    if (c.checked) state.checked[c.dataset.k] = true; else delete state.checked[c.dataset.k];
    save(); c.closest("label").classList.toggle("done", c.checked);
  }));
  $("#untick").onclick = () => { state.checked = {}; save(); renderGrocery(); };
  $("#clear").onclick = () => { if (confirm("Clear the whole grocery list?")) { state.plan = {}; state.checked = {}; save(); updateCount(); renderGrocery(); } };
  $("#copy").onclick = async () => {
    const line = (i) => `- ${i.name}${i.q ? " — " + i.q : ""}`;
    const text = [...aisles.map((a) => `${a.toUpperCase()}\n${buy.filter((i) => i.aisle === a).map(line).join("\n")}`),
      pantry.length ? `CHECK YOU HAVE\n${pantry.map(line).join("\n")}` : ""].filter(Boolean).join("\n\n");
    try { await navigator.clipboard.writeText(text); $("#copy").textContent = "Copied"; } catch (e) { prompt("Copy the list:", text); }
  };
}


// ---- recipe request ------------------------------------------------------
const REQUEST_EMAIL = "poses_salami.3v@icloud.com";
const REQUEST_FIELDS = [["photo", "Picture"], ["prep", "Prep time (minutes)"], ["cook", "Cook time (minutes)"], ["tags", "Tags"],
  ["ingredients", "Ingredients"], ["method", "Method"], ["notes", "Variations and notes"], ["source", "Where is it from?"]];

function requestText() {
  const f = new FormData($("#req"));
  const name = (f.get("name") || "").trim();
  $("#f-name-err").hidden = !!name;
  if (!name) { $("#f-name").focus(); return null; }
  const parts = [`Dish name: ${name}`];
  for (const [k, label] of REQUEST_FIELDS) {
    const v = (f.get(k) || "").trim();
    if (v) parts.push(v.includes("\n") ? `${label}:\n${v}` : `${label}: ${v}`);
  }
  parts.push("(If you have a photo, attach it to this email.)");
  return { name, body: parts.join("\n\n") };
}
$("#req").onsubmit = (e) => {
  e.preventDefault();
  const r = requestText();
  if (!r) return;
  location.href = `mailto:${REQUEST_EMAIL}?subject=${encodeURIComponent("Recipe request: " + r.name)}&body=${encodeURIComponent(r.body)}`;
};
$("#copy-req").onclick = async () => {
  const r = requestText();
  if (!r) return;
  const text = `To: ${REQUEST_EMAIL}\nSubject: Recipe request: ${r.name}\n\n${r.body}`;
  try { await navigator.clipboard.writeText(text); $("#copy-req").textContent = "Copied. Paste it into an email"; }
  catch (err) { prompt("Copy this into an email:", text); }
};

// ---- start ---------------------------------------------------------------
fetch("recipes/recipes.json").then((r) => r.json()).then((data) => {
  recipes = data; updateCount(); renderList();
}).catch(() => { $("#cards").innerHTML = `<div class="empty">Could not load recipes.</div>`; });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
