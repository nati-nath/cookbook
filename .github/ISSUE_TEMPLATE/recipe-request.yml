name: Recipe request
description: Ask for a recipe to be added to the Cookbook
title: "Recipe request: "
labels: ["recipe request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Everything you write here is public. Fill in what you know; only the dish name is required.
  - type: input
    id: name
    attributes:
      label: Dish name
      placeholder: Okonomiyaki
    validations:
      required: true
  - type: textarea
    id: photo
    attributes:
      label: Picture
      description: Drag a photo into this box, or paste a link. Only share a photo you took yourself or have the right to share.
  - type: input
    id: prep
    attributes:
      label: Prep time (minutes)
  - type: input
    id: cook
    attributes:
      label: Cook time (minutes)
  - type: input
    id: tags
    attributes:
      label: Tags
      description: For example japanese, vegetarian, oven, quick
  - type: textarea
    id: ingredients
    attributes:
      label: Ingredients
      description: One per line, with the amount. For example "2 courgettes" or "100 g plain flour". Use a heading line for groups such as Sauce.
  - type: textarea
    id: method
    attributes:
      label: Method
      description: One step per line.
  - type: textarea
    id: notes
    attributes:
      label: Variations and notes
  - type: input
    id: source
    attributes:
      label: Where is it from?
      description: A link, or the name of the person or book.
